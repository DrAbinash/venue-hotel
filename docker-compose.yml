services:
  venue-hotel:
    build: .
    image: venue-hotel:latest
    container_name: venue-hotel
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/hotel.db
      - UPLOAD_DIR=/app/data/uploads
      # Change this before exposing the site, and keep it out of version control.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-venue-admin}
      # Keeps admin sessions alive across restarts.
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-}
      # Needed to build payment return URLs behind a proxy or custom domain.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # Optional: gateway credentials can also be entered in Admin → Payments.
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      - ICICI_MERCHANT_ID=${ICICI_MERCHANT_ID:-}
      - ICICI_SUB_MERCHANT_ID=${ICICI_SUB_MERCHANT_ID:-}
      - ICICI_ENCRYPTION_KEY=${ICICI_ENCRYPTION_KEY:-}
    volumes:
      # The database and the uploaded images share one volume so a single
      # backup captures the whole site.
      - venue-hotel-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"try { require('http').get('http://localhost:3000/', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1)); setTimeout(() => process.exit(1), 5000); } catch(e) { process.exit(1); }\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  venue-hotel-data:
    name: venue-hotel-data
